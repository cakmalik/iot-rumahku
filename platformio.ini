; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Kecepatan upload diturunkan agar stabil di chip USB-serial CP2102.
; Jika tetap gagal, coba turunkan lagi ke 74880.
upload_speed = 115200

; Library async web server (non-blocking).
; Pasangan ini WAJIB sama versinya (AsyncTCP + ESPAsyncWebServer dari ESP32Async).
lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
